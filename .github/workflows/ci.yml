name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Auto-sync promotes dev -> master with GITHUB_TOKEN, whose pushes never trigger
  # workflows — so master could change with no CI run to show for it. Dispatch fills
  # that hole: any promotion can be verified on demand against the exact master tip.
  workflow_dispatch:

jobs:
  darwin-kernel:
    name: darwin-kernel — test + typecheck
    runs-on: ubuntu-latest
    container:
      image: node:22-alpine
    defaults:
      run:
        working-directory: packages/darwin-kernel

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: node --test --experimental-strip-types test/*.test.ts

      - name: Typecheck
        run: npx tsc --noEmit

  # Nothing in CI had ever run a single one of the 611 test_*.py files under runner/. That is
  # how 22 tests in test_economic_scheduler*.py stayed red long enough for their contract to
  # drift out from under them unnoticed, and how three separate scan-window bugs shipped in one
  # day. Turning all 611 on at once is not available: most need SUPABASE_URL +
  # SUPABASE_SERVICE_KEY, and an unknown number are red today — and a CI job that is red on
  # arrival just teaches people to ignore CI.
  #
  # So this is the blocking beachhead: pure-logic guards, no network, no credentials, 0.2s.
  # It covers the failure modes that actually cost days this month. The rest of the suite gets
  # fixed and folded in behind it rather than dumped in all at once.
  runner-guards:
    name: runner — offline guard tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: pip install --quiet pytest

      - name: Run offline guard tests
        working-directory: runner
        # Deliberately unset so a test that quietly reaches for the control plane fails here
        # instead of passing in CI and lying about what it covers.
        env:
          SUPABASE_URL: ''
          SUPABASE_SERVICE_KEY: ''
        run: python -m pytest tests/test_ci_offline.py -q --no-header

      - name: Syntax-check every runner module
        working-directory: runner
        # Cheap and total: catches the "half-landed refactor" class that has taken the fleet
        # down before (a bare `for` loop referencing an undefined name, a missing import that
        # fail-soft handling masked) across all sources, not just the ones with tests.
        run: python -m compileall -q . > /dev/null

      - name: Syntax-check repo-root modules
        # runner/ was the only tree compiled, so repo-root entry points — canary.py included,
        # which the scheduled canary workflow shells out to — could ship a syntax error and
        # still show a green CI.
        run: python -m compileall -q *.py > /dev/null

  # The queue and the repo disagreed, and nothing was checking.
  #
  # tasks/*.task.json carried no status field at all, so "has this improvement
  # shipped?" was unanswerable from the repo — you had to read public.tasks by
  # hand, and it has 24k rows. The first reconciliation run found the honest
  # answer: of 21 task files, ZERO were DEPLOYED_AND_VERIFIED. Six had merged
  # without anyone verifying them, three were still open, three quarantined, and
  # one had no queue row at all.
  #
  # Portfolio-wide the same gap: 8,078 PHANTOM_UNVERIFIED against 413 verified.
  # That is what happens when MERGED is read as "done" — the reclassification
  # that produced those phantoms had to be run retroactively, over thousands of
  # rows, because nothing caught the drift as it happened.
  #
  # This job catches it as it happens. It fails when a task file has no single
  # queue row, which is the condition under which nobody can say whether the
  # work is done.
  #
  # Skipped rather than failed when credentials are absent — a fork PR has no
  # secrets, and a job that is red on arrival for everyone teaches people to
  # ignore CI. Same reasoning as runner-guards above.
  task-reconciliation:
    name: tasks — reconcile against the queue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check for control-plane credentials
        id: creds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SUPABASE_URL / SUPABASE_SERVICE_KEY not set — skipping task reconciliation."
          fi

      - name: Reconcile task files against public.tasks
        if: steps.creds.outputs.available == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        # --check reports without rewriting the files. Exit 1 when any task file
        # is MISSING or AMBIGUOUS in the queue.
        run: python3 runner/tools/reconcile_task_files.py --check

  # DEPENDENCY MANIFEST — the acceptance check that existed and never ran.
  #
  # scripts/verify_deps.py calls itself "Acceptance check for the dependency
  # manifest" and fails when a package declared in requirements*.txt is not
  # importable, or when `runner` itself cannot be imported. Nothing invoked it, so
  # it could only catch drift that someone already suspected and went looking for.
  #
  # The drift is documented in requirements.txt's own header: the file "previously
  # listed only requests/python-dotenv/prometheus-client, so a fresh clone that ran
  # pip install -r requirements.txt still could not import large parts of runner/".
  # requirements-dev.txt records the same class of failure a second time, for
  # pytest-timeout: declared nowhere, so the merge gate died with "unrecognized
  # arguments: --timeout" on any machine built from the manifest.
  #
  # Both were found by a person hitting them. This job is what finds the third one:
  # it installs from the manifest ALONE — never an ad-hoc `pip install X` — so a
  # package that is only present because a developer's laptop happens to have it
  # fails here instead of on the next clean machine.
  dependency-manifest:
    name: deps — manifest installs and imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install from the manifest only
        run: pip install --quiet -r requirements-dev.txt

      - name: Verify every declared package imports
        run: python3 scripts/verify_deps.py
