name: Auto-sync orchestrator/dev → production branch

on:
  push:
    branches:
      - orchestrator/dev

permissions:
  contents: write

concurrency:
  group: auto-sync-production
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fast-forward master from orchestrator/dev
        run: |
          git checkout master
          if git merge --ff-only origin/orchestrator/dev; then
            echo "Fast-forward succeeded"
            git push origin master
          else
            echo "::error::Cannot fast-forward master from orchestrator/dev — manual merge required."
            echo "::error::master is AHEAD of orchestrator/dev. That happens when something is pushed"
            echo "::error::directly to master. Until master is merged back into orchestrator/dev, every"
            echo "::error::promote silently does nothing. Commits on master but not on dev:"
            git --no-pager log --oneline origin/orchestrator/dev..master | head -20
            exit 1
          fi
