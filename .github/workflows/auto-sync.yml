name: Release train — orchestrator/dev ⇄ production branch

# Both directions, on purpose.
#
#   push orchestrator/dev -> promote  (ff-only into master)
#   push master           -> reabsorb (fold master back into orchestrator/dev)
#
# The promote is ff-only, so the train breaks the moment master gains a commit dev does
# not have. Before 2026-08-18 that break was silent (::warning:: + exit 0), and master
# reached 14 commits ahead of dev with dev 0 ahead while every run reported success.
# Making it loud is necessary but not sufficient: GitHub's "Merge pull request" button
# targets the repository DEFAULT branch, so any PR opened without an explicit --base
# lands on master and wedges the train again. Two did, within minutes, while the first
# wedge was being cleared. `reabsorb` is what makes the invariant repair itself.
#
# See scripts/release_train_sync.sh for why this terminates rather than ping-ponging.

on:
  push:
    branches:
      - orchestrator/dev
      - master

permissions:
  contents: write

concurrency:
  group: auto-sync-production
  # NOT cancel-in-progress. A train is a queue: cancelling an in-flight promote drops it,
  # and the next push has no idea it needs to carry the previous one. Observed on
  # 2026-08-18 — PR #37's sync run was cancelled by #39's and never promoted.
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Promote orchestrator/dev → master
        if: github.ref == 'refs/heads/orchestrator/dev'
        run: bash scripts/release_train_sync.sh promote

      # reabsorb THEN promote, in one job on purpose. A push made with GITHUB_TOKEN does
      # not trigger workflows (GitHub's recursion guard), so the re-absorbing push to
      # orchestrator/dev fires nothing. In the diverged case that would leave dev ahead of
      # master with no promote scheduled — the train repaired but stalled. Promote is a
      # no-op when the two are already equal, so running it unconditionally is free.
      - name: Re-absorb master → orchestrator/dev, then promote
        if: github.ref == 'refs/heads/master'
        run: |
          bash scripts/release_train_sync.sh reabsorb
          bash scripts/release_train_sync.sh promote
