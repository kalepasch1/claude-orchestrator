<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Madeus OG</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#0b0c0b}
.card{position:relative;width:1200px;height:630px;overflow:hidden;color:#fff;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  background:radial-gradient(circle at 68% 40%,#343633 0,#161715 30%,#080908 68%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff0b 1px,transparent 1px),linear-gradient(90deg,#ffffff0b 1px,transparent 1px);background-size:48px 48px}
.arc{position:absolute;left:880px;top:300px;border:1px solid #ffffff21;border-radius:50%;transform:translate(-50%,-50%)}
.a1{width:570px;height:570px}.a2{width:370px;height:370px}
.a3{width:720px;height:280px;transform:translate(-50%,-50%) rotate(-18deg)}
.horizon{position:absolute;left:0;right:0;top:372px;height:1px;background:#ffffff24;box-shadow:0 0 60px 18px #ffffff0d}
.slab{position:absolute;left:880px;top:300px;width:124px;height:316px;transform:translate(-50%,-50%);
  display:flex;align-items:center;justify-content:center;border:1px solid #ffffff4d;
  background:linear-gradient(135deg,#ffffff30,#00000073);box-shadow:0 0 110px #ffffff21;font-size:46px}
.slab i{position:absolute;left:0;right:0;height:1px;background:#ffffff29}
.slab i:nth-of-type(1){top:25%}.slab i:nth-of-type(2){top:50%}.slab i:nth-of-type(3){top:75%}
.mark{position:absolute;left:72px;top:64px;font-size:25px;font-weight:600;letter-spacing:3.4px}
.eyebrow{position:absolute;left:72px;top:170px;font-size:14px;font-weight:600;letter-spacing:3.4px;color:#a7d8bd}
h1{position:absolute;left:69px;top:212px;font-size:84px;font-weight:400;letter-spacing:-3.8px;line-height:.98}
.sub{position:absolute;left:72px;top:414px;width:600px;font-size:21px;line-height:1.5;color:#c9cbc5}
.rule{position:absolute;left:72px;top:536px;width:548px;height:1px;background:linear-gradient(90deg,#ffffff8c,#ffffff00)}
.foot{position:absolute;left:72px;right:72px;top:562px;display:flex;justify-content:space-between;font-size:15px;font-weight:600;letter-spacing:2.6px}
.foot b{font-weight:600}.foot span{color:#8f938c}
</style></head><body>
<div class="card">
  <div class="grid"></div>
  <div class="arc a1"></div><div class="arc a2"></div><div class="arc a3"></div>
  <div class="horizon"></div>
  <div class="slab">M<i></i><i></i><i></i></div>
  <div class="mark">MADEUS</div>
  <div class="eyebrow">PRIVATE INTELLIGENCE &middot; GOVERNED EXECUTION</div>
  <h1>Company building,<br>without limits.</h1>
  <div class="sub">The private operating system for founders running multiple companies.</div>
  <div class="rule"></div>
  <div class="foot"><b>MADEUS.CC</b><span>BY INVITATION</span></div>
</div>
</body></html>
