[tool.ruff]
# Generated from CLAUDE.md conventions
# Run: python scripts/generate_lint_rules.py

line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "C901",
    "E501",
    "E741",
    "F841",
    "PLR0912",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"test_*.py" = ["F841"]
