# Configuration for task retries in the runner environment.
# This file defines the retry budget for various failure scenarios.
# Values are expressed in number of attempts.

# Global defaults - can be overridden by specific task configurations.
default_retries: 3  # Default retry count for most tasks.
max_retries: 5      # Maximum allowed retries, regardless of task configuration.

# Specific task retry overrides.  These take precedence over the default.
# Format: <task_slug>:<retry_count>
# Example: my-important-task: 4  # Override for a specific task.

# Special cases - these are critical and require higher retry budgets.
critical_tasks:
  - slug: "some-critical-task"
    retries: 7 # Increased retry budget for critical tasks.
  - slug: "another-important-process"
    retries: 6

# Transient errors - these are expected to be intermittent and should have more retries.
transient_errors:
  - slug: "task-with-network-dependency"
    retries: 4 # Increased retry budget for tasks with network dependencies.

# Long-running tasks - may require more attempts due to timeouts or resource constraints.
long_running_tasks:
  - slug: "complex-data-processing"
    retries: 5 # Increased retry budget for long-running tasks.

# Debugging/testing tasks - allow more retries during development and testing.
debug_tasks:
  - slug: "test-task-1"
    retries: 4
