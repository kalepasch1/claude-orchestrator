# Rule-based auto-clearing for operator approval cards.
# Fallback: used when operator_autoclear_rules DB table is empty or unavailable.
#
# Hard guards (code-enforced, regardless of rules):
#   - Never auto-approve if AUTOCLEAR_ENABLED env var is not 'true'
#   - Never auto-approve if approvals_required >= 2
#   - Never auto-approve if kind == 'legal'
#   - Never auto-approve if detail mentions 'prod' or 'production'
#
# Rule matching: project (null = any), kind, max_usd (if set, card amount must be <= this).
# When a card matches a rule: status='approved', decided_by='auto-rule:<id>'

rules:
  # Example: auto-approve small staging deploys for beethoven project
  - id: beethoven-staging-small
    project: beethoven
    kind: operator
    max_usd: 50.0
    enabled: true

  # Example: auto-approve small secrets for any project (null project = match all)
  - id: secrets-under-25
    kind: secret
    max_usd: 25.0
    enabled: true

# Autoclear policy — defines how to handle stale/conflicting rule resources.
# When rules conflict or become stale, these policies determine what cleanup actions
# to take (e.g., delete associated volumes, logs, or artifacts).
#
# Policy rule format:
#   - id: unique policy rule identifier
#   - action: cleanup action (delete_volume, delete_logs, delete_artifacts)
#   - target: resource identifier or glob pattern
#   - condition: (optional) predicate on task context (e.g., "status==completed")
#   - rollback: if true, flag error when action fails; if false, log warning and continue
#   - enabled: whether this policy rule is active

policy:
  # Example: auto-cleanup volumes for completed tasks
  - id: cleanup-completed-volumes
    action: delete_volume
    target: task-*-vol
    condition: status==completed
    rollback: false
    enabled: true

  # Example: auto-cleanup logs for cancelled tasks
  - id: cleanup-cancelled-logs
    action: delete_logs
    target: task-*-logs
    condition: status==cancelled
    rollback: false
    enabled: true

  # Example: auto-cleanup artifacts with rollback on failure
  - id: cleanup-stale-artifacts
    action: delete_artifacts
    target: task-*-artifacts
    condition: status!=pending
    rollback: true
    enabled: true
