[pytest]
# Which tests exist should not depend on which path someone happens to type.
#
# There are two test locations in this repo: runner/tests/ (13,619 tests) and
# runner/*.py at the top of the runner package (152 files, 3,896 tests). Nothing
# declared either, so `pytest runner/tests` collected the first set and `pytest
# runner` collected both — a 3,896-test difference decided by the argument.
# CI runs a single file from runner/, so those 3,896 had never run there at all.
#
# testpaths makes a bare `pytest` collect everything. It does not change what CI
# runs today (ci.yml names its target explicitly and deliberately, so that the
# blocking job stays green); it removes the ambiguity underneath.
#
# The 152 files at runner/*.py are in the wrong place — tests belong beside the
# other tests — but moving them is a rename of 152 files and is its own change.
# Collecting them is the part that matters now.
testpaths = runner

# Match pytest's defaults explicitly rather than inheriting them, so a future
# conftest or plugin cannot quietly narrow collection.
python_files = test_*.py
python_classes = Test* *Test
python_functions = test_*

# A hung test must fail, not wedge the run.
#
# requirements-dev.txt documents the merge gate as
#   python3 -m pytest runner/tests tests -q -p no:randomly --timeout=60
# and declares pytest-timeout for it — but the timeout lived only in that one command
# line, so every OTHER way of running the suite had no bound at all. Three consecutive
# attempts to take `pytest runner/tests/` to green were abandoned after the run stalled
# (reported at 31%, 14% and 14%) with no way to see which test was responsible, and the
# conclusion recorded each time was "the suite does not terminate". Reproduced here at
# --timeout=25: the suite does terminate and nothing timed out — it is slow, not hung —
# but that took a bounded run to establish, which is exactly the point.
#
# Setting it here makes the bound the default for every invocation. A genuine hang now
# fails one test with a stack dump naming it, instead of costing a session.
#
# 60 -> 120 on 2026-09-06. The 60s figure was "~2.5x the slowest observed test", but
# that multiple was measured on a QUIET box, and this bound is enforced on whatever the
# machine happens to be doing. Measured the same day: test_branch_manager.py ran 24.3s
# quiet and ~80s at load 28.6 -- a 3.3x spread on the same commit. production_push_guard
# tolerates load up to cpus x 0.5 before it even starts the suite, so a bound calibrated
# quiet is thinner than its own comment claims exactly when it fires.
timeout = 120

# signal, not thread, since 2026-09-06 -- and the reason is what `thread` does when the
# bound is missed.
#
# thread cannot interrupt the test. Its timer thread dumps every thread's stack and calls
# os._exit(1), which skips pytest's terminal reporter: no FAILED line, no summary, no
# "N passed", and every test after that one never runs. On 2026-09-06 that turned two
# merely-SLOW tests into a dead session, and production_push_guard -- which sees only
# exit 1 with no parseable failure -- reported an anonymous "suite red", re-ran into the
# identical os._exit, and blocked a production promotion for hours. No test had failed.
#
# signal raises in the test instead, so the same slowness degrades into ONE named FAILED
# line while the other ~13,000 tests still run -- and a test that only misses the bound
# under load is precisely the environmental flake the guard's cool-down re-run exists to
# absolve. That machinery already works; thread was denying it any input.
#
# The trade is real and it is why thread was chosen originally: signal fires only on the
# main thread, and it cannot interrupt a blocking C call that never returns to the
# interpreter. For a true C-level wedge, thread still gives an instant stack dump where
# signal gives nothing until the gate's own 3600s clock. That is the rarer failure here
# -- this suite's actual experience is slowness under load, not C wedging -- and it is
# one hour lost once, against thread destroying a whole session every time a test drifts
# past the bound. When a wedge IS suspected, `--timeout-method=thread` still gets the
# stack dump on demand.
#
# Either way production_push_guard now DETECTS a killed session and names the test
# responsible rather than calling it red; see _session_was_killed there.
timeout_method = signal

markers =
    allow_network: this test genuinely needs a real socket; the hermetic guard in runner/tests/conftest.py will not block it.
