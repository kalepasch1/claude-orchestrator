[pytest]
# Which tests exist should not depend on which path someone happens to type.
#
# There are two test locations in this repo: runner/tests/ (13,619 tests) and
# runner/*.py at the top of the runner package (152 files, 3,896 tests). Nothing
# declared either, so `pytest runner/tests` collected the first set and `pytest
# runner` collected both — a 3,896-test difference decided by the argument.
# CI runs a single file from runner/, so those 3,896 had never run there at all.
#
# testpaths makes a bare `pytest` collect everything. It does not change what CI
# runs today (ci.yml names its target explicitly and deliberately, so that the
# blocking job stays green); it removes the ambiguity underneath.
#
# The 152 files at runner/*.py are in the wrong place — tests belong beside the
# other tests — but moving them is a rename of 152 files and is its own change.
# Collecting them is the part that matters now.
testpaths = runner

# Match pytest's defaults explicitly rather than inheriting them, so a future
# conftest or plugin cannot quietly narrow collection.
python_files = test_*.py
python_classes = Test* *Test
python_functions = test_*

markers =
    allow_network: this test genuinely needs a real socket; the hermetic guard in runner/tests/conftest.py will not block it.
